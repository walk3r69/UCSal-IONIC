<ion-view view-title="Atualização cadastral">
  <ion-content class="portal-page">
    <main class="portal-container narrow-container" aria-labelledby="profile-title">
      <section class="page-intro">
        <p class="eyebrow">SEUS DADOS</p>
        <h1 id="profile-title">Atualização cadastral</h1>
        <p>Mantenha seus canais de contato atualizados para receber comunicados da UCSal.</p>
      </section>

      <form name="profileForm" class="portal-card form-card" novalidate ng-submit="vm.save(profileForm)">
        <div class="form-section">
          <p class="form-section-title">Dados institucionais</p>
          <label class="field-label" for="full-name">Nome completo</label>
          <input id="full-name" class="portal-input" type="text" ng-model="vm.form.fullName" ng-disabled="true">
          <label class="field-label" for="registration-profile">Matrícula</label>
          <input id="registration-profile" class="portal-input" type="text" ng-model="vm.form.registration" ng-disabled="true">
          <label class="field-label" for="course">Curso</label>
          <input id="course" class="portal-input" type="text" ng-model="vm.form.course" ng-disabled="true">
        </div>

        <div class="form-section">
          <p class="form-section-title">Dados editáveis</p>
          <label class="field-label" for="email">E-mail pessoal</label>
          <input id="email" class="portal-input" type="email" name="email" ng-model="vm.form.email" required>
          <label class="field-label" for="phone">Telefone / WhatsApp</label>
          <input id="phone" class="portal-input" type="tel" name="phone" ng-model="vm.form.phone" required>
          <div class="field-grid">
            <div><label class="field-label" for="cep">CEP</label><input id="cep" class="portal-input" type="text" ng-model="vm.form.cep"></div>
            <div><label class="field-label" for="city">Cidade</label><input id="city" class="portal-input" type="text" ng-model="vm.form.city"></div>
          </div>
          <label class="field-label" for="street">Rua e número</label>
          <input id="street" class="portal-input" type="text" ng-model="vm.form.street">
          <label class="field-label" for="neighborhood">Bairro</label>
          <input id="neighborhood" class="portal-input" type="text" ng-model="vm.form.neighborhood">
        </div>

        <button class="button button-block portal-button" type="submit" ng-disabled="profileForm.$invalid">Salvar alterações <span aria-hidden="true">↗</span></button>
      </form>
    </main>
  </ion-content>
</ion-view>
